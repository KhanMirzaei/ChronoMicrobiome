name: R package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check source launcher in a path containing spaces
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/chrono path test"
          cp -R . "$RUNNER_TEMP/chrono path test/ChronoMicrobiome"
          Rscript "$RUNNER_TEMP/chrono path test/ChronoMicrobiome/bin/chronomicrobiome" doctor
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
